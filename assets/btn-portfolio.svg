<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="196" height="46" viewBox="0 0 196 46"><style>@font-face{font-family:'pk-mono-m';font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.ring{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.glow{animation:breathe 7s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1400px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5aa8"/><stop offset="1" stop-color="#c5106a"/></linearGradient></defs><rect x="1" y="1" width="194" height="44" rx="22" fill="url(#bg)"/><text x="98.0" y="28.5" font-size="13" text-anchor="middle" letter-spacing="1.2"><tspan font-family="pk-mono-m" font-style="normal" fill="#fff">VIEW PORTFOLIO ↗</tspan></text></svg>